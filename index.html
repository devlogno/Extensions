<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FloatBar Dev Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="icon" type="image/png" href="images/icon128.png">
    <style>
        [x-cloak] { display: none !important; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDt1Vxt2PwpbYImZfLbZrkCuduz4nStbfM",
            authDomain: "extension-page.firebaseapp.com",
            projectId: "extension-page",
            storageBucket: "extension-page.firebasestorage.app",
            messagingSenderId: "837525897212",
            appId: "1:837525897212:web:5488fae8bb42c96ee5bc79",
            measurementId: "G-DN46TYYV3T"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const analytics = getAnalytics(app);

        // Expose Firebase functions to Alpine.js
        window.fb = {
            login: (email, password) => signInWithEmailAndPassword(auth, email, password),
            logout: () => signOut(auth),
            onStateChange: (cb) => onAuthStateChanged(auth, cb)
        };
    </script>
</head>
<body class="bg-[#f5f5f7] dark:bg-[#1e1e1e] text-[#333] dark:text-[#e0e0e0] font-sans" 
    x-data="{ 
        page: 'home', 
        user: null, 
        email: '', 
        password: '', 
        authMode: 'login', 
        loading: false,
        async handleAuth() {
            if (!this.email || !this.password) return alert('Please fill all fields');
            this.loading = true;
            try {
                await window.fb.login(this.email, this.password);
                this.page = 'home';
                this.email = '';
                this.password = '';
            } catch (err) {
                alert(err.message);
            } finally {
                this.loading = false;
            }
        },
        async logout() {
            await window.fb.logout();
            this.page = 'home';
        }
    }"
    x-init="window.fb.onStateChange(u => { user = u; })">

    <nav class="bg-white dark:bg-[#2c2c2e] border-b border-gray-200 dark:border-gray-800 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div @click="page = 'home'" class="flex items-center gap-2 cursor-pointer">
                <div class="w-8 h-8 bg-orange-500 rounded-lg shadow-lg shadow-orange-500/30 flex items-center justify-center font-bold text-white">F</div>
                <span class="font-bold text-xl tracking-tight">FloatBar <span class="text-orange-500">Dev</span></span>
            </div>
            <div class="flex gap-4 text-sm font-semibold">
                <button @click="page = 'home'" :class="page === 'home' ? 'text-orange-500' : 'hover:text-orange-500'">Extensions</button>
                <button @click="page = 'report'" :class="page === 'report' ? 'text-orange-500' : 'hover:text-orange-500'">Report Issue</button>
                <button @click="page = 'login'" x-show="!user" class="bg-orange-500 text-white px-3 py-1 rounded-md">Login</button>
                <button @click="logout()" x-show="user" class="text-red-500">Logout</button>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 py-10">
        
        <template x-if="page === 'home'">
            <div>
                <div class="flex justify-between items-end mb-8">
                    <div>
                        <h1 class="text-4xl font-extrabold tracking-tight mb-2">Our <span class="text-orange-500">Extensions</span></h1>
                        <p class="text-gray-500 dark:text-gray-400">Boost your browser productivity with our official tools.</p>
                    </div>
                    <button x-show="user" @click="page = 'add-ext'" class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-green-700 transition">
                        + Add New
                    </button>
                </div>

                <div class="grid gap-6">
                    <div class="bg-white dark:bg-[#2c2c2e] p-6 rounded-2xl border border-gray-200 dark:border-gray-800 shadow-sm flex gap-6 items-start">
                        <img src="images/icon128.png" class="w-20 h-20 rounded-2xl shadow-md" alt="Icon">
                        <div class="flex-1">
                            <h3 class="text-xl font-bold mb-1">FloatBar Apps Always On Top</h3>
                            <p class="text-gray-500 dark:text-gray-400 text-sm mb-4">The ultimate quick-access side bar and Always-on-Top PiP manager for your browser.</p>
                            <div class="flex gap-3">
                                <a href="#" class="text-sm font-bold text-orange-500 border border-orange-500 px-4 py-1.5 rounded-full hover:bg-orange-500 hover:text-white transition">View on Store</a>
                                <button @click="page = 'uninstall'" class="text-sm text-gray-400 hover:text-red-500 transition">Remove</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <template x-if="page === 'report'">
            <div class="bg-white dark:bg-[#2c2c2e] p-8 rounded-3xl shadow-xl border border-gray-200 dark:border-gray-800">
                <h2 class="text-2xl font-bold mb-6">Submit an <span class="text-orange-500">Issue</span></h2>
                <form class="space-y-4" @submit.prevent="alert('Issue Submitted! (Connect your DB here)')">
                    <div>
                        <label class="block text-sm font-medium mb-1">Select Extension</label>
                        <select class="w-full p-3 bg-gray-50 dark:bg-[#1e1e1e] rounded-xl border border-gray-200 dark:border-gray-700">
                            <option>FloatBar Apps Always On Top</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Problem Description</label>
                        <textarea rows="4" class="w-full p-3 bg-gray-50 dark:bg-[#1e1e1e] rounded-xl border border-gray-200 dark:border-gray-700" placeholder="Explain what went wrong..."></textarea>
                    </div>
                    <button class="w-full bg-orange-500 text-white font-bold py-3 rounded-xl hover:bg-orange-600 transition shadow-lg shadow-orange-500/20">Send Feedback</button>
                </form>
            </div>
        </template>

        <template x-if="page === 'uninstall'">
            <div class="text-center max-w-md mx-auto">
                <div class="text-6xl mb-4">😢</div>
                <h2 class="text-2xl font-bold mb-2">We're sorry to see you go!</h2>
                <p class="text-gray-500 mb-8">Could you tell us why you're removing FloatBar? It helps us improve.</p>
                
                <form class="text-left space-y-3 bg-white dark:bg-[#2c2c2e] p-6 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-800" @submit.prevent="alert('Thank you for your feedback!')">
                    <label class="flex items-center gap-3 p-2 hover:bg-gray-50 dark:hover:bg-gray-800 rounded-lg cursor-pointer">
                        <input type="checkbox" class="accent-orange-500"> <span>Found a bug</span>
                    </label>
                    <label class="flex items-center gap-3 p-2 hover:bg-gray-50 dark:hover:bg-gray-800 rounded-lg cursor-pointer">
                        <input type="checkbox" class="accent-orange-500"> <span>Too complicated to use</span>
                    </label>
                    <label class="flex items-center gap-3 p-2 hover:bg-gray-50 dark:hover:bg-gray-800 rounded-lg cursor-pointer">
                        <input type="checkbox" class="accent-orange-500"> <span>Performance issues</span>
                    </label>
                    <label class="flex items-center gap-3 p-2 hover:bg-gray-50 dark:hover:bg-gray-800 rounded-lg cursor-pointer">
                        <input type="checkbox" class="accent-orange-500"> <span>Missing a feature I need</span>
                    </label>
                    <textarea class="w-full p-3 mt-4 bg-gray-50 dark:bg-[#1e1e1e] rounded-xl border border-gray-200 dark:border-gray-700 text-sm" placeholder="Other comments..."></textarea>
                    <button class="w-full bg-gray-900 dark:bg-orange-500 text-white font-bold py-3 rounded-xl mt-4">Submit & Goodbye</button>
                </form>
            </div>
        </template>

        <template x-if="page === 'login'">
            <div class="max-w-sm mx-auto bg-white dark:bg-[#2c2c2e] p-8 rounded-3xl shadow-xl border border-gray-200 dark:border-gray-800 text-center">
                <div class="w-16 h-16 bg-gray-100 dark:bg-gray-800 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">🔐</div>
                <h2 class="text-xl font-bold mb-6">Admin Login</h2>
                
                <div class="space-y-4">
                    <input type="email" x-model="email" class="w-full p-3 bg-gray-50 dark:bg-[#1e1e1e] rounded-xl border border-gray-200 dark:border-gray-700" placeholder="Email Address">
                    <input type="password" x-model="password" class="w-full p-3 bg-gray-50 dark:bg-[#1e1e1e] rounded-xl border border-gray-200 dark:border-gray-700" placeholder="Password">
                    
                    <button @click="handleAuth()" :disabled="loading" class="w-full bg-orange-500 text-white font-bold py-3 rounded-xl transition flex items-center justify-center gap-2">
                        <template x-if="loading">
                            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        </template>
                        <span>Login</span>
                    </button>
                </div>
            </div>
        </template>

        <template x-if="page === 'add-ext' && user">
            <div class="bg-white dark:bg-[#2c2c2e] p-8 rounded-3xl shadow-xl border border-gray-200 dark:border-gray-800">
                <div class="flex items-center gap-4 mb-6">
                    <button @click="page = 'home'" class="text-gray-400 hover:text-black">← Back</button>
                    <h2 class="text-2xl font-bold">Add <span class="text-green-500">New Extension</span></h2>
                </div>
                <form class="space-y-4" @submit.prevent="alert('Saved to DB!')">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-1 text-gray-500">Extension Name</label>
                            <input type="text" class="w-full p-3 bg-gray-50 dark:bg-[#1e1e1e] rounded-xl border border-gray-200 dark:border-gray-700">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1 text-gray-500">Store Link (URL)</label>
                            <input type="url" class="w-full p-3 bg-gray-50 dark:bg-[#1e1e1e] rounded-xl border border-gray-200 dark:border-gray-700">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1 text-gray-500">Description</label>
                        <textarea rows="3" class="w-full p-3 bg-gray-50 dark:bg-[#1e1e1e] rounded-xl border border-gray-200 dark:border-gray-700"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1 text-gray-500">Icon URL</label>
                        <input type="text" placeholder="https://..." class="w-full p-3 bg-gray-50 dark:bg-[#1e1e1e] rounded-xl border border-gray-200 dark:border-gray-700">
                    </div>
                    <button class="w-full bg-green-600 text-white font-bold py-3 rounded-xl hover:bg-green-700 transition">Publish Extension</button>
                </form>
            </div>
        </template>

    </div>

    <footer class="text-center py-10 text-gray-400 text-sm">
        &copy; 2026 FloatBar Apps. Designed for Developers.
    </footer>

</body>
</html>
