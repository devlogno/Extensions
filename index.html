<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logno Dev - My Extensions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="icon" type="image/png" href="images/icon.png">
    <style>
        [x-cloak] { display: none !important; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>

</head>
<body class="bg-[#f5f5f7] dark:bg-[#1e1e1e] text-[#333] dark:text-[#e0e0e0] font-sans min-h-screen" 
    x-data="{ 
        page: 'home', 
        loading: false,
        selectedExt: '',
        hasExtParam: false,
        toastMsg: '',
        toastTimeout: null,
        showToast(msg) {
            this.toastMsg = msg;
            clearTimeout(this.toastTimeout);
            this.toastTimeout = setTimeout(() => this.toastMsg = '', 2500);
        },
        extensions: [],

        init() {
            // Load Extensions
            const savedExts = localStorage.getItem('fb_extensions');
            this.extensions = savedExts ? JSON.parse(savedExts) : [
                { name: 'FloatBar Apps Always On Top', link: 'https://chromewebstore.google.com/detail/ffkkamgakebpomhcmmcokcmjmjcjdpbk', desc: 'The ultimate quick-access side bar and Always-on-Top PiP manager for your browser.', icon: 'images/FloatBar.png' },
                { name: 'Arrow Skip: Shorts & Reels Controller', link: 'https://chromewebstore.google.com/detail/hnladddlgkmhakgegpjgnofjgdfnkapf', desc: 'Skip, seek, and control speed on YouTube Shorts, TikTok & Reels. Sticky speed locks your rate. Precision arrow-key controls.', icon: 'images/ArrowSkip.png' },
                { name: 'Side Panel Notes for Google Keep', link: 'https://chromewebstore.google.com/detail/mjemlecjchpdmponobellganeopiiomo', desc: 'Native side panel for Google Keep™. View notes, checklists, and tasks side-by-side. Lightweight, private, and secure.', icon: 'images/keep.png' },
                { name: 'Side Panel Search — Drag & Drop for Google', link: 'https://chromewebstore.google.com/detail/lcdcllbfkiepddipeepngmiphknmofem', desc: 'Side Panel Search: Drag & drop images or text for instant lookup. Multitask without switching tabs. Compatible with Google Search.', icon: 'https://raw.githubusercontent.com/devlogno/Extensions/refs/heads/main/images/SideSearch.png' },
                { name: 'Visual Bookmark Manager', link: 'https://chromewebstore.google.com/detail/milnjhlabbokndleafifdbkobjgepjhg', desc: 'Visual bookmark manager for your side panel. Organizes links in a mobile-style app drawer grid with dark mode & glassmorphism.', icon: 'images/VisualBookmark.png' },
                { name: 'Floating Scientific Calculator Pro: Offline Math', link: 'https://chromewebstore.google.com/detail/ihcnkhpfpinafogajmfobkmgnnhgleef', desc: 'Powerful, floating scientific calculator with PiP mode for easy multitasking.', icon: 'images/PinCal.png' },
            ];

            // 2. Handle Direct Linking (Routing)
            // Allows links like: index.html?p=issue or index.html?p=leaving
            const params = new URLSearchParams(window.location.search);
            const route = params.get('p');
            const extParam = params.get('ext');
            
            if (extParam) {
                this.hasExtParam = true;
                // Use nextTick to ensure extensions are rendered before setting the model
                this.$nextTick(() => {
                    this.selectedExt = extParam;
                });
            }

            if (route && ['home', 'report', 'leaving', 'privacy', 'contact', 'admin'].includes(route)) {
                this.page = route === 'report' ? 'report' : route;
            }
        },

        async submitNetlifyIssue(e) {
            this.loading = true;
            const formData = new FormData(e.target);
            formData.append('form-name', 'issue-report'); // Tell Netlify which form this is
            
            try {
                await fetch('https://fancy-unicorn-ba5059.netlify.app/', {
                    method: 'POST',
                    mode: 'no-cors',
                    body: formData
                });
                this.showToast('Thank you! Issue submitted successfully.');
                this.page = 'home';
                e.target.reset();
            } catch (err) {
                this.showToast('Error submitting form: ' + err.message);
            } finally {
                this.loading = false;
            }
        },

        async submitNetlifyLeaving(e) {
            const formData = new FormData(e.target);
            const reasons = formData.getAll('reason');
            const comment = formData.get('comment');
            
            if (reasons.length === 0 && (!comment || !comment.trim())) {
                this.showToast('Please select a reason or leave a comment');
                return;
            }
            
            this.loading = true;
            formData.append('form-name', 'leaving-feedback'); // Tell Netlify which form this is
            
            try {
                await fetch('https://fancy-unicorn-ba5059.netlify.app/', {
                    method: 'POST',
                    mode: 'no-cors',
                    body: formData
                });
                this.showToast('Thank you for your feedback! I am sorry to see you go.');
                this.page = 'home';
                e.target.reset();
            } catch (err) {
                this.showToast('Error submitting form: ' + err.message);
            } finally {
                this.loading = false;
            }
        }
    }">

    <nav class="bg-white dark:bg-[#2c2c2e] border-b border-gray-200 dark:border-gray-800 sticky top-0 z-50 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-row items-center justify-between gap-4">
            <div @click="window.location.href = window.location.pathname" class="flex items-center gap-2 cursor-pointer group">
                <div class="w-8 h-8 bg-orange-500 rounded-lg shadow-lg shadow-orange-500/30 flex items-center justify-center font-bold text-white group-hover:scale-110 transition shrink-0">L</div>
                <span class="hidden sm:block font-bold text-xl tracking-tight">Logno <span class="text-orange-500">Dev</span></span>
            </div>
            <div class="flex gap-4 text-sm font-semibold">
                <button @click="page = 'home'" :class="page === 'home' ? 'text-orange-500' : 'hover:text-orange-500'">Home</button>
                <button @click="page = 'report'" :class="page === 'report' ? 'text-orange-500' : 'hover:text-orange-500'">Issue</button>
                <button @click="page = 'leaving'" :class="page === 'leaving' ? 'text-orange-500' : 'hover:text-orange-500'">Leaving?</button>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-2 py-2">
        
        <!-- HOME / SHOWCASE -->
        <template x-if="page === 'home'">
            <div class="animate-fade-in">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-12 gap-6">
                    <div>
                        <h1 class="text-5xl font-black tracking-tight mb-3">My <span class="text-orange-500">Extensions</span></h1>
                        <p class="text-gray-500 dark:text-gray-400 text-lg">Boost your browser productivity with my extension tools.</p>
                    </div>
                </div>

                <div class="flex flex-wrap justify-center gap-4">
                    <template x-for="(ext, index) in extensions" :key="index">
                        <div class="w-full md:w-[calc(50%-1rem)] bg-white dark:bg-[#2c2c2e] p-4 rounded-[2rem] border border-gray-200 dark:border-gray-800 shadow-sm hover:shadow-2xl transition duration-300 group relative">
                            <div class="flex flex-col sm:flex-row gap-6 items-center sm:items-start text-center sm:text-left">
                                <img :src="ext.icon || 'images/icon128.png'" class="w-24 h-24 rounded-[0.5rem] shadow-lg group-hover:scale-105 transition object-cover" alt="Icon">
                                <div class="flex-1 w-full">
                                    <h3 class="text-2xl font-black mb-2" x-text="ext.name"></h3>
                                    <p class="text-gray-500 dark:text-gray-400 text-sm mb-6 leading-relaxed" x-text="ext.desc"></p>
                                    <div class="flex flex-wrap gap-4 items-center justify-center sm:justify-start w-full">
                                        <a :href="ext.link" target="_blank" class="text-sm font-bold bg-orange-500 text-white px-6 py-2 rounded-full hover:bg-orange-600 transition shadow-lg shadow-orange-500/30">View on Store</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- INFO SECTIONS -->
                <div class="mt-24 space-y-16">
                    <section class="bg-orange-50 dark:bg-orange-900/10 p-10 rounded-[3rem] border border-orange-100 dark:border-orange-900/30">
                        <h2 class="text-3xl font-black mb-4">About Me</h2>
                        <p class="text-gray-600 dark:text-gray-400 text-lg leading-relaxed">I am Logno, I think those extensions can bost productivity and improve your browsing experience. Thanks Everyone!</p>
                    </section>
                </div>
            </div>
        </template>

        <!-- REPORT ISSUE -->
        <template x-if="page === 'report'">
            <div class="text-center animate-fade-in max-w-2xl mx-auto">
                <div class="text-6xl mb-8">🐛</div>
                <h2 class="text-3xl font-black mb-4">Submit an <span class="text-orange-500">Issue</span></h2>
                <p class="text-gray-500 mb-8 text-lg">Found a bug or have a feature request? Let me know!</p>
                <form class="space-y-6 text-left" @submit.prevent="submitNetlifyIssue($event)">
                        <!-- Display badge if extension is pre-selected via URL -->
                        <div x-show="hasExtParam" class="flex flex-col items-center mb-2">
                            <div class="inline-flex items-center gap-3 bg-orange-100 dark:bg-orange-900/30 text-orange-600 dark:text-orange-400 font-bold px-5 py-2 rounded-full text-sm">
                                <img :src="(extensions.find(e => e.name === selectedExt) || {}).icon || 'images/icon.png'" class="w-6 h-6 rounded object-cover">
                                <span x-text="selectedExt"></span>
                            </div>
                            <input type="hidden" name="extension" :value="selectedExt" :disabled="!hasExtParam">
                        </div>

                        <!-- Display dropdown if no extension was pre-selected -->
                        <div x-show="!hasExtParam">
                            <label class="block text-sm font-bold mb-2 ml-1">Extension</label>
                            <div class="relative">
                                <select name="extension" x-model="selectedExt" :disabled="hasExtParam" :required="!hasExtParam" class="w-full p-4 bg-gray-50 dark:bg-[#1e1e1e] rounded-2xl border border-gray-200 dark:border-gray-700 focus:ring-2 ring-orange-500 outline-none transition cursor-pointer appearance-none">
                                    <option value="" disabled :selected="!selectedExt">✨ Select an extension...</option>
                                    <template x-for="ext in extensions">
                                        <option :value="ext.name" :selected="selectedExt === ext.name" x-text="ext.name"></option>
                                    </template>
                                </select>
                                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </div>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-2 ml-1">What went wrong?</label>
                            <textarea name="desc" required rows="1" x-data="{ resize() { $el.style.height = 'auto'; $el.style.height = $el.scrollHeight + 'px' } }" @input="resize()" x-init="$nextTick(() => resize())" class="w-full px-4 pt-6 pb-2 bg-gray-100 dark:bg-gray-800/50 rounded-t-lg border-0 border-b-2 border-gray-400 dark:border-gray-600 focus:ring-0 focus:border-orange-500 focus:bg-gray-50 dark:focus:bg-[#2c2c2e] outline-none transition-colors overflow-hidden" placeholder="Explain the bug in detail..."></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-2 ml-1">Follow-up Email (Optional)</label>
                            <input type="email" name="email" class="w-full px-4 pt-6 pb-2 bg-gray-100 dark:bg-gray-800/50 rounded-t-lg border-0 border-b-2 border-gray-400 dark:border-gray-600 focus:ring-0 focus:border-orange-500 focus:bg-gray-50 dark:focus:bg-[#2c2c2e] outline-none transition-colors" placeholder="So I can reply to your Issue report...">
                        </div>
                        <button type="submit" :disabled="loading" class="w-full bg-orange-500 text-white font-black py-4 rounded-2xl hover:bg-orange-600 transition shadow-xl shadow-orange-500/30 flex justify-center items-center gap-2">
                            <span x-show="loading" class="animate-spin text-xl">⏳</span>
                            <span x-text="loading ? 'Sending...' : 'Send Feedback'"></span>
                        </button>
                    </form>
                </div>
            </div>
        </template>

        <!-- LEAVING / UNINSTALL -->
        <template x-if="page === 'leaving'">
            <div class="text-center animate-fade-in max-w-2xl mx-auto">
                <div class="text-6xl mb-8">😢</div>
                <h2 class="text-3xl font-black mb-4">I'm sorry to see you go!</h2>
                <p class="text-gray-500 mb-8 text-lg">It helps me improve if you tell me why you're removing this extension.</p>
                
                <form class="space-y-4 text-left" @submit.prevent="submitNetlifyLeaving($event)">
                        <!-- Display badge if extension is pre-selected via URL -->
                        <div x-show="hasExtParam" class="flex flex-col items-center mb-6">
                            <div class="inline-flex items-center gap-3 bg-orange-100 dark:bg-orange-900/30 text-orange-600 dark:text-orange-400 font-bold px-5 py-2 rounded-full text-sm">
                                <img :src="(extensions.find(e => e.name === selectedExt) || {}).icon || 'images/icon.png'" class="w-6 h-6 rounded object-cover">
                                <span x-text="selectedExt"></span>
                            </div>
                            <input type="hidden" name="extension" :value="selectedExt" :disabled="!hasExtParam">
                        </div>

                        <!-- Display dropdown if no extension was pre-selected -->
                        <div x-show="!hasExtParam" class="mb-6">
                            <label class="block text-sm font-bold mb-2 ml-1">Extension</label>
                            <div class="relative">
                                <select name="extension" x-model="selectedExt" :disabled="hasExtParam" :required="!hasExtParam" class="w-full p-4 bg-gray-50 dark:bg-[#1e1e1e] rounded-2xl border border-gray-200 dark:border-gray-700 focus:ring-2 ring-orange-500 outline-none transition cursor-pointer appearance-none">
                                    <option value="" disabled :selected="!selectedExt">✨ Select an extension...</option>
                                    <template x-for="ext in extensions">
                                        <option :value="ext.name" :selected="selectedExt === ext.name" x-text="ext.name"></option>
                                    </template>
                                </select>
                                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </div>
                            </div>
                        </div>

                    <template x-for="reason in ['Found a bug', 'Too complicated', 'Security Concern']">
                        <label class="flex items-center gap-4 p-4 hover:bg-orange-50 dark:hover:bg-orange-900/10 rounded-2xl cursor-pointer transition">
                            <input type="checkbox" name="reason" :value="reason" class="w-5 h-5 accent-orange-500"> 
                            <span class="font-bold" x-text="reason"></span>
                        </label>
                    </template>
                    <textarea name="comment" rows="1" x-data="{ resize() { $el.style.height = 'auto'; $el.style.height = $el.scrollHeight + 'px' } }" @input="resize()" x-init="$nextTick(() => resize())" class="w-full px-4 pt-6 pb-2 mt-6 bg-gray-100 dark:bg-gray-800/50 rounded-t-lg border-0 border-b-2 border-gray-400 dark:border-gray-600 text-sm focus:ring-0 focus:border-orange-500 focus:bg-gray-50 dark:focus:bg-[#2c2c2e] outline-none transition-colors overflow-hidden" placeholder="Any other comments?"></textarea>
                    
                    <input type="email" name="email" class="w-full px-4 pt-6 pb-2 mt-6 bg-gray-100 dark:bg-gray-800/50 rounded-t-lg border-0 border-b-2 border-gray-400 dark:border-gray-600 text-sm focus:ring-0 focus:border-orange-500 focus:bg-gray-50 dark:focus:bg-[#2c2c2e] outline-none transition-colors" placeholder="Follow-up email (optional)">
                    
                    <button type="submit" :disabled="loading" class="w-full bg-gray-900 dark:bg-orange-500 text-white font-black py-4 rounded-2xl mt-6 shadow-xl flex justify-center items-center gap-2">
                        <span x-show="loading" class="animate-spin text-xl">⏳</span>
                        <span x-text="loading ? 'Submitting...' : 'Submit & Goodbye'"></span>
                    </button>
                </form>
            </div>
        </template>

        <!-- PRIVACY -->
        <template x-if="page === 'privacy'">
            <div class="max-w-2xl mx-auto animate-fade-in">
                <div class="bg-white dark:bg-[#2c2c2e] p-10 rounded-[3rem] shadow-2xl border border-gray-200 dark:border-gray-800">
                    <h2 class="text-3xl font-bold mb-6 flex items-center gap-2 text-orange-500">🛡️ Privacy First</h2>
                    <p class="text-lg text-gray-500 dark:text-gray-400 leading-relaxed mb-6">I believe your data is yours. I <strong>Don't</strong> collect, transmit, distribute, or sell any of your personal data.</p>
                    <ul class="text-lg text-gray-500 dark:text-gray-400 space-y-4 list-disc pl-5">
                        <li>No browsing history tracking.</li>
                        <li>100% Local Storage on your device.</li>
                        <li>No accounts required for users.</li>
                    </ul>
                </div>
            </div>
        </template>

        <!-- CONTACT -->
        <template x-if="page === 'contact'">
            <div class="max-w-2xl mx-auto animate-fade-in text-center">
                <div class="bg-white dark:bg-[#2c2c2e] p-10 rounded-[3rem] shadow-2xl border border-gray-200 dark:border-gray-800 flex flex-col items-center justify-center">
                    <h2 class="text-3xl font-bold mb-6 flex items-center gap-2 text-orange-500">📧 Contact Me</h2>
                    <p class="text-lg text-gray-500 dark:text-gray-400 mb-8 max-w-sm">Have questions or a feature request? Reach out directly!</p>
                    <a href="mailto:lognodev7@gmail.com" class="inline-flex items-center gap-3 bg-gray-900 dark:bg-gray-700 text-white px-8 py-4 rounded-full text-lg font-bold hover:bg-orange-500 transition shadow-xl hover:-translate-y-1">
                        <span>lognodev7@gmail.com</span>
                        <span>→</span>
                    </a>
                </div>
            </div>
        </template>

        <!-- ADMIN (Links Generator) -->
        <template x-if="page === 'admin'">
            <div class="max-w-4xl mx-auto animate-fade-in">
                <div class="bg-white dark:bg-[#2c2c2e] p-10 rounded-[3rem] shadow-2xl border border-gray-200 dark:border-gray-800">
                    <h2 class="text-3xl font-bold mb-6 flex items-center gap-2 text-orange-500">🛠️ Extension Links</h2>
                    <p class="text-gray-500 mb-8">Copy these URLs to use inside your extensions. They will automatically select the right extension in the forms!</p>
                    <div class="space-y-6">
                        <template x-for="ext in extensions">
                            <div class="p-6 bg-gray-50 dark:bg-[#1e1e1e] rounded-2xl border border-gray-200 dark:border-gray-700">
                                <h3 class="text-xl font-black mb-4 flex items-center gap-3">
                                    <img :src="ext.icon || 'images/icon.png'" class="w-8 h-8 rounded-lg object-cover">
                                    <span x-text="ext.name"></span>
                                </h3>
                                <div class="space-y-4">
                                    <div>
                                        <label class="text-xs font-bold text-gray-500 uppercase">Leave Link (Uninstall URL)</label>
                                        <input type="text" readonly :value="window.location.origin + window.location.pathname + '?p=leaving&ext=' + encodeURIComponent(ext.name)" class="w-full mt-1 p-3 bg-white dark:bg-gray-800 rounded-xl text-sm font-mono border border-gray-200 dark:border-gray-700 focus:outline-none focus:ring-2 ring-orange-500 transition cursor-copy" @click="$el.select(); document.execCommand('copy'); showToast('Copied to clipboard!')">
                                    </div>
                                    <div>
                                        <label class="text-xs font-bold text-gray-500 uppercase">Issue Link (Bug Report URL)</label>
                                        <input type="text" readonly :value="window.location.origin + window.location.pathname + '?p=report&ext=' + encodeURIComponent(ext.name)" class="w-full mt-1 p-3 bg-white dark:bg-gray-800 rounded-xl text-sm font-mono border border-gray-200 dark:border-gray-700 focus:outline-none focus:ring-2 ring-orange-500 transition cursor-copy" @click="$el.select(); document.execCommand('copy'); showToast('Copied to clipboard!')">
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </template>

    </main>

    <footer class="text-center py-6 text-gray-400 text-sm border-t border-gray-100 dark:border-gray-900 mt-4">
        <p class="mb-2">&copy; 2026 Logno Dev. Designed for Productivity.</p>
        <div class="flex justify-center gap-6 mt-4">
            <button @click="page = 'privacy'" class="hover:text-orange-500">Privacy</button>
            <button @click="page = 'report'" class="hover:text-orange-500">Support</button>
            <button @click="page = 'contact'" class="hover:text-orange-500">Contact</button>
        </div>
    </footer>

    <!-- TOAST NOTIFICATION -->
    <div x-show="toastMsg" x-transition.opacity.duration.300ms class="fixed bottom-6 right-6 bg-gray-900 dark:bg-white text-white dark:text-gray-900 font-bold px-6 py-3 rounded-2xl shadow-2xl flex items-center gap-3 z-50" style="display: none;">
        <span class="text-green-400 dark:text-green-500">✓</span>
        <span x-text="toastMsg"></span>
    </div>
</body>
</html>
